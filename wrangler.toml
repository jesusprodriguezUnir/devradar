# Configuración de Cloudflare Pages + binding D1 para las Pages Functions de functions/.
# El deploy del sitio sigue siendo `wrangler pages deploy dist` (publica también functions/).
name = "devradar"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# Base de datos D1. Crear una vez con:  npx wrangler d1 create devradar
# y pegar aquí el database_id que devuelve.
[[d1_databases]]
binding = "DB"
database_name = "devradar"
database_id = "REEMPLAZAR_CON_EL_ID_DE_npx_wrangler_d1_create"

# Variables/secretos (WRITE_TOKEN, GITHUB_TOKEN) se configuran en el panel de
# Cloudflare Pages → Settings → Functions, no aquí.
