name: Ingest & Deploy

on:
  schedule:
    - cron: "0 5,17 * * *"   # 05:00 y 17:00 UTC (cada 12h)
  workflow_dispatch:           # ejecucion manual
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - ".cache/**"

permissions:
  contents: write     # para commitear data/ y .cache/
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ingesta de recursos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ingest

      - name: Commit de datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ .cache/
          git diff --quiet --cached || git commit -m "chore(data): refresco automatico [skip ci]"
          git push || echo "Nada que pushear"

      - name: Build Astro
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
