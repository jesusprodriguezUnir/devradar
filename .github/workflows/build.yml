name: Ingest & Deploy

on:
  schedule:
    - cron: "0 5,17 * * *"   # 05:00 y 17:00 UTC (cada 12h)
  workflow_dispatch:           # ejecucion manual
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - ".cache/**"

permissions:
  contents: write     # para commitear data/ y .cache/

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ingesta de recursos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ingest

      - name: Commit de datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ .cache/
          git diff --quiet --cached || git commit -m "chore(data): refresco automatico [skip ci]"
          git push || echo "Nada que pushear"

      - name: Build Astro
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: npm run build

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=devradar --branch=main
